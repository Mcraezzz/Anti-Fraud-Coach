<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Anti-Fraud Coach Chat Shield</title>
  <desc id="desc">A chat bubble with a check mark, symbolizing AI conversation and safety confirmation.</desc>
  <defs>
    <linearGradient id="bgGrad2" x1="37" y1="37" x2="475" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E63FF"/>
      <stop offset="1" stop-color="#00D4AA"/>
    </linearGradient>
    <filter id="softShadow2" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0b1f3a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="37" y="37" width="438" height="438" rx="102" fill="url(#bgGrad2)" filter="url(#softShadow2)"/>

  <!-- Chat bubble body -->
  <rect x="95" y="112" width="322" height="268" rx="60" fill="#ffffff"/>
  <!-- Chat bubble tail -->
  <polygon points="225,380 256,416 287,380" fill="#ffffff"/>

  <!-- Check mark -->
  <path d="M 185,270 L 235,320 L 335,215"
        fill="none"
        stroke="#1E63FF"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Anti-Fraud Coach Leaf Shield</title>
  <desc id="desc">A minimal leaf-shaped shield with a check mark, symbolizing natural protection and growth.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="37" y1="37" x2="475" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E63FF"/>
      <stop offset="1" stop-color="#00D4AA"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0b1f3a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="37" y="37" width="438" height="438" rx="102" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Leaf shape -->
  <path d="M 256,72
           C 143,92  51,215  102,317
           C 102,317 174,394  256,476
           C 338,394 410,317  410,317
           C 461,215 369,92   256,72 Z"
        fill="#ffffff"/>

  <!-- Check mark -->
  <path d="M 183,267 L 233,330 L 341,230"
        fill="none"
        stroke="#00BEAA"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>

  <rect x="72" y="72" width="368" height="368" rx="88" fill="url(#tile)" filter="url(#softShadow)"/>

  <g opacity="0.98">
    <circle cx="186" cy="154" r="32" fill="url(#person)"/>
    <path d="M150 335C154 272 162 218 188 202C214 218 224 272 228 335H150Z" fill="url(#person)" opacity="0.88"/>
    <path d="M206 214C226 190 253 176 286 170" fill="none" stroke="#dce7ff" stroke-width="20" stroke-linecap="round"/>
    <circle cx="286" cy="170" r="11" fill="#dce7ff"/>
  </g>

  <path d="M286 126L374 160C369 264 350 329 286 386C222 329 203 264 198 160L286 126Z" fill="url(#shield)" stroke="#f8fbff" stroke-width="14" stroke-linejoin="round"/>
  <path d="M286 152L348 176C343 254 329 303 286 345C243 303 229 254 224 176L286 152Z" fill="#ffffff" opacity="0.16"/>

  <path d="M250 260L278 288L329 226" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 260L278 288L329 226" fill="none" stroke="#21c58b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

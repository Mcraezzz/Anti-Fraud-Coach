<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Anti-Fraud Coach guardian logo</title>
  <desc id="desc">A minimal abstract person holding a protective shield.</desc>
  <defs>
    <linearGradient id="tile" x1="92" y1="82" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081a33"/>
      <stop offset="0.6" stop-color="#123d77"/>
      <stop offset="1" stop-color="#1e63ff"/>
    </linearGradient>
    <linearGradient id="person" x1="154" y1="126" x2="242" y2="346" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#7db7ff"/>
    </linearGradient>
    <linearGradient id="shield" x1="208" y1="130" x2="364" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7db7ff"/>
      <stop offset="0.54" stop-color="#1e63ff"/>
      <stop offset="1" stop-color="#21c58b"/>
    </linearGradient>
    <filter id="softShadow" x="40" y="40" width="432" height="432" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b1f3a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="none"/>
